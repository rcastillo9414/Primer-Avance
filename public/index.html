<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Rikimaka HR - Inicio de Sesión</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #f2f2f2;
    }
    .login-card {
      max-width: 420px;
      margin: 80px auto;
    }
  </style>
</head>

<body>

  <div class="login-card card shadow">
    <div class="card-body">

      <h3 class="text-center mb-4">Rikimaka HR</h3>

      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label" for="email">Correo</label>
          <input 
            type="email" 
            id="email"
            name="email" 
            class="form-control" 
            autocomplete="email"
            required
          >
        </div>

        <div class="mb-3">
          <label class="form-label" for="password">Contraseña</label>
          <input 
            type="password" 
            id="password"
            name="password" 
            class="form-control" 
            autocomplete="current-password"
            required
          >
        </div>

        <button class="btn btn-primary w-100" type="submit">Ingresar</button>
      </form>

      <p class="text-muted text-center mt-3" style="font-size: 0.85rem;">
        Ingrese sus credenciales para acceder al sistema.
      </p>
    </div>
  </div>

  <!-- Script de login -->
  <script src="/js/auth.js"></script>
  <script>
    // Conectar el formulario con handleLogin
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('loginForm');
      if (form && typeof handleLogin === 'function') {
        form.addEventListener('submit', handleLogin);
      } else {
        console.error('No se encontró loginForm o handleLogin');
      }
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
