<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proyectos | Rikimaka HR</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="p-4 bg-light">

  <div class="container">

    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1>Proyectos</h1>
      <a href="dashboard_auth.html" class="btn btn-secondary">Atrás</a>
    </div>

    <!-- FORMULARIO CREAR PROYECTO (solo Admin/ATH) -->
    <div id="adminProjectPanel" class="card p-3 mb-4 shadow-sm" style="display: none;">
      <h4>Crear Proyecto</h4>

      <form id="createProjectForm">

        <div class="mb-2">
          <label class="form-label" for="code">Código</label>
          <input name="code" id="code" class="form-control" required>
        </div>

        <div class="mb-2">
          <label class="form-label" for="name">Nombre</label>
          <input name="name" id="name" class="form-control" required>
        </div>

        <div class="mb-2">
          <label class="form-label" for="budget">Presupuesto</label>
          <input type="number" min="0" name="budget" id="budget" class="form-control">
        </div>

        <div class="mb-2">
          <label class="form-label" for="resources">Recursos</label>
          <input type="number" min="0" name="resources" id="resources" class="form-control">
        </div>

        <button class="btn btn-primary w-100 mt-2" type="submit">Crear Proyecto</button>
      </form>
    </div>

    <!-- LISTADO -->
    <div class="card p-3 shadow-sm">
      <h4>Listado de Proyectos</h4>

      <div class="table-responsive mt-3">
        <table class="table table-bordered">
          <thead class="table-light">
            <tr>
              <th>Código</th>
              <th>Nombre</th>
              <th>Presupuesto</th>
              <th>Recursos</th>
              <th>Miembros</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="projectsTbody"></tbody>
        </table>
      </div>
    </div>

  </div>

  <script src="/js/project.js"></script>
  <script src="/js/auth.js"></script>

</body>
</html>
