<!doctype html>
<html>
<head>
  <meta charset="utf-8"> <!-- Configura el carácter para que pueda escribir en diferentes idiomas -->
  <meta name="viewport" content="width=device-width,initial-scale=1"> <!-- Hace que la página sea adaptable en móviles -->
  <title>Vacaciones - Rikimaka</title> <!-- Título de la página que aparece en la pestaña -->
  <!-- Enlace a Bootstrap para estilos bonitos y fáciles -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Enlace a un archivo de estilos personalizado (puede tener colores, fuentes, etc.) -->
  <link href="/public/css/style.css" rel="stylesheet">
</head>
<body class="p-4"> <!-- Padding (espacio) alrededor del contenido -->
  <div class="container"> <!-- Contenedor principal para centrar y dar espacio -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <!-- Encabezado con título y botón para volver atrás -->
      <h1>Vacaciones</h1>
      <a class="btn btn-secondary" href="/public/html/dashboard.html">Atras</a>
    </div>
    <!-- Tarjeta para solicitar vacaciones -->
    <div class="card p-3 mb-3">
      <h5>Solicitar vacaciones</h5>
      <!-- Formulario para que el usuario ingrese las fechas y razón -->
      <form id="vacationForm">
        <!-- Fecha de inicio de vacaciones -->
        <div class="mb-2">
          <label>Fecha inicio vacaciones</label>
          <input type="date" name="startDate" class="form-control" required>
        </div>
        <!-- Fecha final de vacaciones -->
        <div class="mb-2">
          <label>Fecha final de vacaciones</label>
          <input type="date" name="endDate" class="form-control" required>
        </div>
        <!-- Razón para la solicitud, puede poner N/A si no aplica -->
        <div class="mb-2">
          <label>Razón si no aplica, puede poner N/A</label>
          <input name="reason" class="form-control">
        </div>
        <!-- Botón para enviar la solicitud -->
        <button class="btn btn-primary">Enviar solicitud</button>
      </form>
    </div>
    <!-- Sección para mostrar las solicitudes que ya hizo el usuario -->
    <div class="card p-3">
      <h5>Mis solicitudes</h5>
      <!-- Aquí se mostrarán las solicitudes en formato de texto -->
      <pre id="myVacations" style="white-space:pre-wrap"></pre>
    </div>
  </div>
<!-- Funciones que manejan la lógica del formulario y datos -->
<script src="../js/vacaciones.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
