<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Panel Proyectos - TI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  */ este bloque de codigo nos permite la opcion de crear proyectos, asignando presupuesto, programadores y recursos a el proyecto. /
</head>
<body class="p-4">
  <div class="container">
    <h1>Panel de Proyectos - TI</h1>
    <div class="row gy-3">
      <div class="col-md-4">
        <div class="card p-3">
          <h5>Crear Proyecto</h5>
          <form id="createProjectForm">
            <div class="mb-2">
              <label class="form-label">Código</label>
              <input name="code" class="form-control" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Nombre</label>
              <input name="name" class="form-control" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Presupuesto</label>
              <input name="budget" type="number" class="form-control">
            </div>
            <div class="mb-2">
              <label class="form-label">Recursos</label>
              <input name="resources" type="number" class="form-control">
            </div>
            <button class="btn btn-success w-100" type="submit">Crear</button>
          </form>
        </div>
      </div>
      <div class="col-md-8">
        <div class="card p-3">
          <h5>Proyectos</h5>
          <table class="table">
            <thead><tr><th>Código</th><th>Nombre</th><th>Presupuesto</th><th>Recursos</th><th>Miembros</th><th>Acciones</th></tr></thead>
            <tbody id="projectsTbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="/public/js/projects.js"></script>
</body>
</html>
