<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rikimaka HR - Inicio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="/">Rikimaka HR</a>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row">
      <div class="col-md-6 offset-md-3">
        <div class="card shadow-sm">
          <div class="card-body">
            <h3 class="card-title mb-3">Login</h3>
            <form id="loginForm">
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input class="form-control" name="email" type="email" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input class="form-control" name="password" type="password" required>
              </div>
              <button class="btn btn-primary w-100" type="submit">Ingresar</button>
            </form>
            <hr>
            <p class="small text-muted">Para pruebas, puedes registrar un usuario mediante POST /api/auth/register</p>
          </div>
        </div>
      </div>
    </div>
  </main>

    <script>
    const form = document.getElementById('loginForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(form));
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      const json = await res.json();
      if (res.ok) {
        localStorage.setItem('token', json.token);
        localStorage.setItem('user', JSON.stringify(json.user));
        alert('Ingreso exitoso: ' + json.user.name + ' (' + json.user.role + ')');
        
        // redirecciona por role)
        if (json.user.role === 'ATH') window.location = '/public/dashboard_ath.html';
        else if (json.user.role === 'IT') window.location = '/public/projects_panel.html';
        else window.location = '/public/worklog_form.html';
      } else {
        alert(json.msg || 'Error en login');
      }
    });
  </script>
</body>
</html>
