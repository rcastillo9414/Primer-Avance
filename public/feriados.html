<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feriados | Rikimaka HR</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="p-4 bg-light">

  <div class="container">

    <div class="d-flex justify-content-between mb-3">
      <h1>Feriados</h1>
      <a href="dashboard_auth.html" class="btn btn-secondary">Atrás</a>
    </div>

    <div class="card p-4 mb-4">
      <h4>Registrar feriado</h4>

      <form id="holidayForm">
        <div class="mb-2">
          <label for="holidayName" class="form-label">Nombre del feriado</label>
          <input type="text" id="holidayName" name="name" class="form-control" autocomplete="off" required>
        </div>

        <div class="mb-2">
          <label for="holidayDate" class="form-label">Fecha</label>
          <input type="date" id="holidayDate" name="date" class="form-control" autocomplete="off" required>
        </div>

        <button class="btn btn-primary w-100 mt-2">Guardar</button>
      </form>
    </div>

    <div class="card p-4">
      <h4>Listado</h4>
      <table class="table table-bordered mt-3">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Fecha</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="holidaysTbody"></tbody>
      </table>
    </div>

  </div>

<script src="/js/feriados.js"></script>
<script src="/js/auth.js"></script>

</body>
</html>
