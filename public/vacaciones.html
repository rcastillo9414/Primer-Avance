<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vacaciones | Rikimaka HR</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="p-4 bg-light">

  <div class="container">

    <div class="d-flex justify-content-between mb-3">
      <h1>Vacaciones</h1>
      <a href="dashboard_auth.html" class="btn btn-secondary">Atrás</a>
    </div>

    <!-- FORMULARIO DE SOLICITUD -->
    <div class="card p-3 mb-4 shadow-sm">
      <h4>Solicitar Vacaciones</h4>

      <form id="vacationForm">

        <div class="mb-3">
          <label class="form-label" for="startDate">Fecha de inicio</label>
          <input type="date" id="startDate" name="startDate" class="form-control" autocomplete="off" required>
        </div>

        <div class="mb-3">
          <label class="form-label" for="endDate">Fecha final</label>
          <input type="date" id="endDate" name="endDate" class="form-control" autocomplete="off" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Total de días</label>
          <input type="number" id="totalDays" class="form-control" readonly>
        </div>

        <button class="btn btn-primary w-100" type="submit">Enviar Solicitud</button>
      </form>
    </div>

    <!-- LISTADO DE SOLICITUDES -->
    <div class="card p-3 shadow-sm">
      <h4>Mis Solicitudes</h4>

      <div class="table-responsive mt-3">
        <table class="table table-bordered">
          <thead class="table-light">
            <tr>
              <th>Inicio</th>
              <th>Fin</th>
              <th>Días</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="myVacationsTable">
            <tr>
              <td colspan="4" class="text-center">Cargando...</td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>

  </div>

  <script src="/js/vacaciones.js"></script>
  <script src="/js/auth.js"></script>

</body>
</html>
