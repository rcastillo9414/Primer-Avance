<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reportes | Rikimaka HR</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Chart.js para gráficos -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- CSS propio -->
  <link href="/css/style.css" rel="stylesheet">

</head>

<body class="p-4 bg-light">

  <div class="container">

    <div class="d-flex justify-content-between mb-4">
      <h1>Reportes</h1>
      <a href="dashboard_auth.html" class="btn btn-secondary">Atrás</a>
    </div>

    <!-- HORAS POR PROYECTO -->
    <div class="card p-3 mb-4 shadow-sm">
      <h4>Horas por Proyecto</h4>
      <button id="btnHours" class="btn btn-primary btn-sm mt-2 mb-3">Cargar</button>

      <div class="table-responsive">
        <table class="table table-bordered">
          <thead class="table-light">
            <tr>
              <th>Proyecto</th>
              <th>Horas Totales</th>
            </tr>
          </thead>
          <tbody id="tableHours"></tbody>
        </table>
      </div>

      <canvas id="chartHours" height="120"></canvas>
    </div>

    <!-- PRODUCTIVIDAD POR USUARIO -->
    <div class="card p-3 shadow-sm">
      <h4>Productividad por Usuario</h4>
      <button id="btnProd" class="btn btn-primary btn-sm mt-2 mb-3">Cargar</button>

      <div class="table-responsive">
        <table class="table table-bordered">
          <thead class="table-light">
            <tr>
              <th>Usuario</th>
              <th>Horas Registradas</th>
            </tr>
          </thead>
          <tbody id="tableProd"></tbody>
        </table>
      </div>

      <canvas id="chartProd" height="120"></canvas>
    </div>

  </div>

  <script src="/js/reportes.js"></script>
  <script src="/js/auth.js"></script>

</body>
</html>
