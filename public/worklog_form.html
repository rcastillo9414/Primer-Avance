<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Worklog | Rikimaka HR</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="p-4 bg-light">
  <div class="container">

    <div class="d-flex justify-content-between mb-3">
      <h1>Worklog</h1>
      <a href="dashboard_auth.html" class="btn btn-secondary">Atrás</a>
    </div>

    <!-- FORM CREAR WORKLOG -->
    <div class="card p-3 mb-4 shadow-sm">
      <h4>Nuevo Registro</h4>

      <form id="worklogForm">

        <div class="mb-3">
          <label class="form-label">Proyecto</label>
          <select id="project" name="project" class="form-select" required></select>
        </div>

        <div class="mb-3">
          <label class="form-label">Fecha</label>
          <input type="date" id="date" name="date" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Actividad realizada</label>
          <input type="text" id="activity" name="activity" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Horas dedicadas</label>
          <input type="number" id="hours" name="hours" min="1" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Notas adicionales</label>
          <textarea id="notes" name="notes" class="form-control"></textarea>
        </div>

        <button class="btn btn-primary w-100" type="submit">Guardar</button>
      </form>
    </div>

    <!-- LISTADO -->
    <div class="card p-3 shadow-sm">
      <h4>Mis Registros</h4>

      <div class="table-responsive mt-3">
        <table class="table table-bordered">
          <thead class="table-light">
            <tr>
              <th>Fecha</th>
              <th>Proyecto</th>
              <th>Horas</th>
              <th>Actividades</th>
              <th>Acciones</th>
            </tr>
          </thead>

          <tbody id="worklogsTbody">
            <tr><td colspan="5" class="text-center">Cargando...</td></tr>
          </tbody>

        </table>
      </div>
    </div>

  </div>

  <script src="/js/worklogs.js"></script>
  <script src="/js/auth.js"></script>
</body>

</html>
