<!doctype html>
<html>
<head>
  <!-- Configuración básica del documento -->
  <meta charset="utf-8"> <!-- Codificación de caracteres -->
  <meta name="viewport" content="width=device-width,initial-scale=1"> <!-- Hace que la página sea responsive en dispositivos móviles -->
  
  <title>Reportes - Rikimaka</title> <!-- Título de la pestaña del navegador -->
  
  <!-- Enlace a Bootstrap CSS para estilos predefinidos y diseño responsivo -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Enlace a archivo CSS personalizado -->
  <link href="/public/css/style.css" rel="stylesheet">
</head>
<body class="p-4">
  <!-- Contenedor principal c -->
  <div class="container">
    <!-- Encabezado con título y botón de volver -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1>Reportes</h1> <!-- Título de la página -->
      <a class="btn btn-secondary" href="/public/html/dashboard.html">Atras</a> <!-- Botón que lleva a la página anterior -->
    </div>
    
    <!-- Sección para reporte de horas por proyecto -->
    <div class="card p-3 mb-3">
      <h5>Horas por proyecto</h5> <!-- Título de la sección -->
      <button id="btnLoadHours" class="btn btn-sm btn-primary">Cargar</button> <!-- Botón para cargar datos -->
      <pre id="outHours"></pre> <!-- Área para mostrar resultados -->
    </div>
    
    <!-- Sección para reporte de productividad por usuario -->
    <div class="card p-3">
      <h5>Productividad por usuario</h5> <!-- Título de la sección -->
      <button id="btnLoadProd" class="btn btn-sm btn-primary">Cargar</button> <!-- Botón para cargar datos -->
      <pre id="outProd"></pre> <!-- Área para mostrar resultados -->
    </div>
  </div>
  
  <!-- Scripts JavaScript para funcionalidades -->
  <script src="../js/reportes.js"></script> <!-- Script para manejar los reportes -->
  <script src="../js/auth.js"></script> <!-- Script para manejo de autenticación -->
</body>
</html>
