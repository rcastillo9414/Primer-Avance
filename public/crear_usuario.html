<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear Usuario | Rikimaka HR</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light p-4">

  <div class="container">

    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2>Crear Nuevo Usuario</h2>
      <a href="dashboard_auth.html" class="btn btn-secondary">Volver</a>
    </div>

    <div class="card p-4 shadow">
      <form id="createUserForm">

        <div class="mb-3">
          <label for="name" class="form-label">Nombre</label>
          <input type="text" id="name" name="name" class="form-control" autocomplete="name" required>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Correo electrónico</label>
          <input type="email" id="email" name="email" class="form-control" autocomplete="email" required>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" id="password" name="password" class="form-control" autocomplete="new-password" required>
        </div>

        <div class="mb-3">
          <label for="role" class="form-label">Rol</label>
          <select id="role" name="role" class="form-select" required>
         <option value="Programador">Programador</option>
          <option value="Administrativo">Administrativo</option>
          <option value="Dept IT">Dept IT</option>
          <option value="ATH">ATH (Administrador Total)</option>
        </select>
        </div>

        <button class="btn btn-primary w-100" type="submit">Crear Usuario</button>

      </form>
    </div>

  </div>

  <script src="/js/usuarios.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
